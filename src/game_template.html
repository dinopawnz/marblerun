<!--
  THE GRAND MARBLE RUN  v2  -  a luck-only marble race for Otherside (MML)
  Models: github.com/dinopawnz/marblerun (built in Blender, meshopt + gzip)
  ============================================================

  WHAT IT IS
  Eight giant glass marbles. Walk into the one you want to back,
  the doors shut, the lift hill carries all eight up 70 metres, and
  they race the whole course with obstacles on the way:
    THE DROP - THE STAIRS (roll off two ledges) - THE GATES (each
    lane's gate lifts at a random moment) - THE MUD (random slow) -
    THE TRAPDOORS (stop on a hatch, wait, fall to the deck below) -
    THE ELEVATORS (wait for your lift, ride up to the high road) -
    THE LAST GATES - THE PLUNGE - the finish.
  You ride inside the whole way. Nobody steers anything.

  LUCK, NOTHING ELSE
  Every wait at a gate, hatch or elevator is pure random - being in
  front is never punished. Every stretch's speed is random. The
  winner is drawn at random, 1 in 8 for every marble, every race,
  and the last gates release so that marble crosses the line first.

  HOW TO RUN A RACE
  1. Click a RACE CONTROL kiosk (either side of the boarding bridge).
  2. Type 2468  (change RACE_CODE below before going public).
  3. 20 seconds to walk over the bridge and into a marble.
  4. Doors shut, the bridge folds away, off they go (about 3.5 min).
  5. Everyone rolls back into the station, doors open, bridge back.
     Type the code again for the next race.
  To CANCEL: type the code twice within 10 s. The marbles go straight
  home; anyone inside drops out onto the track (harmless).

  HOST REMOTE (marble_run_remote.html, PIN = RACE_CODE)
  Start / cancel races, change the boarding time, run races back to
  back on their own (AUTO), switch the kiosks off so only you can start
  races, put a message on the scoreboards, and watch who is in which
  marble and the live order. It types "<code> <command>" into the
  hidden prompt "mr-host"; answers come back on the group "mr-remote".

  HOW IT MOVES (the lessons from Ride Lab 2/3, Sky Dragon, Gravity Well)
  - Every marble moves in ONE dated glide per stretch, each glide in a
    group of its own, all made when boarding starts - long before they
    run - and nothing is ever changed after it is made.
  - The floor riders stand on never tips or turns. Only the glass ball
    turns and rolls.
  - Every race's marbles, gates, hatches and lifts are thrown away and
    rebuilt when the race ends, so animations never pile up.
  - The track is solid (invisible boxes under the models).

  Set your spawn point beside the station, around x 60, z -5.
-->

<m-group id="world"></m-group>
<m-group id="race"></m-group>

<script>
  // ==========================================================
  // GUARD
  // ==========================================================
  let scriptErrors = 0, lastError = "";
  function guard(fn) {
    return function (a, b) {
      try { return fn.call(this, a, b); }
      catch (err) { scriptErrors++; lastError = String((err && err.message) || err).slice(0, 60); }
    };
  }
  function every(fn, ms) { return setInterval(guard(fn), ms); }
  function later(fn, ms) { return setTimeout(guard(fn), Math.max(0, ms)); }
  function on(node, type, fn) { node.addEventListener(type, guard(fn)); }

  // ==========================================================
  // TUNING
  // ==========================================================
  const RACE_CODE = "2468";        // start a race. Twice within 10 s cancels one. Also the host remote's PIN.
  const BOARD_SECONDS = 20;        // time to get into a marble (the host remote can change it)
  const AUTO_GAP_SECONDS = 30;     // auto races: the wait between one race ending and the next boarding
  const CLOSE_SECONDS = 3;         // doors shut this long before the lift moves
  const LIFT_SECONDS = 30;         // the ride up the lift hill
  const RACE_SPEED = 10;           // m/s, a marble's average rolling speed
  const SPEED_SPREAD = 0.15;       // each stretch is this much faster or slower, at random
  const WAIT_GATES = [0.5, 6];     // seconds a marble can wait at each obstacle (random)
  const WAIT_TRAP = [0.5, 5];
  const WAIT_ELEVATOR = [0.5, 5];
  const MUD_SPEED = [0.35, 0.75];  // share of normal speed through the mud (random)
  const PLUNGE_SPEED = [20, 24];   // m/s at the bottom of the plunge (random)
  const FINISH_GAPS = [0.3, 4];    // seconds between the winner and the others
  const CANCEL_WINDOW = 10000;
  const LIGHT = 1;

  const BASE = "https://raw.githubusercontent.com/dinopawnz/marblerun/1dbe4ecb9581c8ba320bf29fd5bf0c2edcf673b8/models/";   // pinned to one upload: never an old copy
  const M = (n) => BASE + n + ".glb.gz";

  // the course, built in Blender from the same numbers (course.py in the repo)
  const COURSE = /*COURSE*/null;
  const WORLD = /*WORLD*/null;
  const N = COURSE.names.length;
  const MR = COURSE.mr, FLOOR_TOP = COURSE.floor_top;

  // ==========================================================
  // HELPERS
  // ==========================================================
  const world = document.getElementById("world");
  const raceRoot = document.getElementById("race");
  const r3 = (v) => Math.round(v * 1000) / 1000;
  function el(tag, attrs, parent) {
    const n = document.createElement(tag);
    n.setAttribute("collide", "false");
    for (const k in attrs) {
      let v = attrs[k];
      if (tag === "m-light" && k === "intensity") v = v * LIGHT;
      n.setAttribute(k, typeof v === "number" ? String(r3(v)) : String(v));
    }
    (parent || world).append(n);
    return n;
  }
  const SOLID = { color: "#000000", visible: "false", collide: "true", "cast-shadows": "false" };
  function solid(attrs, parent) { return el("m-cube", Object.assign({}, SOLID, attrs), parent); }
  function setText(label, text, color) {
    if (label._t !== text) { label._t = text; label.setAttribute("content", text); }
    if (color && label._c !== color) { label._c = color; label.setAttribute("font-color", color); }
  }
  const rand = (a, b) => a + Math.random() * (b - a);
  const T0 = Date.now();
  function docNow() {
    try { const t = document.timeline && document.timeline.currentTime; if (typeof t === "number") return t; } catch (e) {}
    return Date.now() - T0;
  }
  // easing, as m-attr-anim plays it (so the server knows where everyone is)
  const EASE = {
    linear: (u) => u,
    easeInQuad: (u) => u * u,
    easeOutQuad: (u) => 1 - (1 - u) * (1 - u),
    easeInOutSine: (u) => -(Math.cos(Math.PI * u) - 1) / 2,
  };

  // ==========================================================
  // THE WORLD - models to look at, invisible boxes to stand on
  // ==========================================================
  el("m-model", { src: M("mr_ground"), "cast-shadows": "false" });
  el("m-model", { src: M("mr_track") });
  el("m-model", { src: M("mr_scenery") });
  solid({ x: 120, y: -1.06, z: 40, width: 560, height: 2, depth: 800 });       // the ground
  WORLD.colliders.forEach((c) => {
    if (c.rx) {
      const g = el("m-group", { x: c.x, y: c.y, z: c.z, ry: c.ry });
      solid({ rx: c.rx, width: c.w, height: c.h, depth: c.d }, g);
    } else {
      solid({ x: c.x, y: c.y, z: c.z, ry: c.ry, width: c.w, height: c.h, depth: c.d });
    }
  });
  [[-50, -20], [50, -20], [-50, 25], [50, 25]].forEach(([x, z]) => el("m-light", { x: x, y: 16, z: z, type: "point", intensity: 1.2, distance: 70, color: "#fff4e0" }));
  const flashLight = el("m-light", { x: 0, y: 24, z: -12, type: "point", intensity: 0, distance: 90, color: "#ffffff" });

  // the boarding bridge: folds away (leaves the document) while a race is on
  const bridge = el("m-group", {});
  el("m-model", { src: M("mr_bridge") }, bridge);
  solid({ x: 0, y: 0.9, z: -4.95, width: 2 * (COURSE.half + 1), height: 0.6, depth: 5.1 }, bridge);
  solid({ x: 0, y: 1.8, z: -7.35, width: 2 * (COURSE.half + 1), height: 1.2, depth: 0.3 }, bridge);
  let bridgeOut = true;
  function setBridge(out) {
    if (out === bridgeOut) return;
    bridgeOut = out;
    if (out) world.append(bridge); else bridge.remove();
  }

  // ==========================================================
  // THE MARBLES AND THE MOVING OBSTACLES (rebuilt every race)
  // ==========================================================
  // pod root (at the station) > glide 1 > glide 2 > ... > glide 24 > the marble
  // Each glide group carries the dated animations of one stretch and nothing
  // else. Before its start time a glide shows 0, after it the whole stretch.
  let marbles = [], obstacles = [];
  const RIDERS = [];              // per marble: who is standing in it (connection id -> last seen)
  function hexSide(i) {
    const a = i * 60, r = a * Math.PI / 180, rc = 2.6 + 0.5;
    return { x: rc * Math.sin(r), z: rc * Math.cos(r), y: (FLOOR_TOP + 7.2) / 2, ry: a, width: 2 * 3.6 * Math.tan(Math.PI / 6) + 0.1, height: 6, depth: 1 };
  }
  function buildMarble(k, plan) {
    const L = COURSE.lanes[k], a0 = L[0].a;
    const root = el("m-group", { x: a0[0], y: a0[1], z: a0[2] }, raceRoot);
    let g = root;
    if (plan) {
      plan.m[k].glides.forEach((s) => {
        g = el("m-group", {}, g);
        ["x", "y", "z"].forEach((ax, j) => {
          const d = s.b[j] - s.a[j];
          if (Math.abs(d) < 0.001) return;
          el("m-attr-anim", { attr: ax, start: 0, end: d, "start-time": Math.round(plan.doc(s.t0)), duration: Math.round(s.t1 - s.t0),
            easing: s.ease[j], loop: "false" }, g);
        });
      });
    }
    // the part riders are in: level, never turned
    const pod = el("m-group", {}, g);
    el("m-model", { src: M("mr_pod_" + COURSE.names[k].toLowerCase()), "cast-shadows": "false" }, pod);
    const floor = el("m-cylinder", Object.assign({}, SOLID, { y: FLOOR_TOP - 0.2, radius: 2.8, height: 0.4, "collision-interval": 1000 }), pod);
    const seen = RIDERS[k] = new Map();         // who is standing in this marble (for the host remote)
    const touch = (e) => { const id = e && e.detail && e.detail.connectionId; if (id !== undefined) seen.set(id, Date.now()); };
    on(floor, "collisionstart", touch); on(floor, "collisionmove", touch);
    on(floor, "collisionend", (e) => { const id = e && e.detail && e.detail.connectionId; if (id !== undefined) seen.delete(id); });
    for (let i = 0; i < 6; i++) if (i !== 3) solid(hexSide(i), pod);
    solid({ y: 7.5, width: 7.4, height: 0.6, depth: 7.4 }, pod);
    // the glass: faces the way it is going and rolls
    const turn = el("m-group", { y: MR, ry: Math.round(COURSE.heading[0]) }, pod);
    const spin = el("m-group", {}, turn);
    el("m-model", { src: M("mr_ball_" + COURSE.names[k].toLowerCase()), "cast-shadows": "false" }, spin);
    if (plan) {
      el("m-attr-anim", { attr: "rx", start: 0, end: 360, duration: Math.round(2 * Math.PI * MR / RACE_SPEED * 1000), loop: "true",
        "start-time": Math.round(plan.doc(plan.tRace)), "pause-time": Math.round(plan.doc(plan.m[k].home)) }, spin);
    }
    return { k: k, root: root, pod: pod, turn: turn, door: null };
  }
  function setDoors(shut) {
    marbles.forEach((m) => {
      if (shut && !m.door) m.door = solid(hexSide(3), m.pod);
      if (!shut && m.door) { m.door.remove(); m.door = null; }
    });
  }
  // one animated part, in a group of its own
  function moving(pos, ry, anim, src) {
    const g = el("m-group", { x: pos[0], y: pos[1], z: pos[2], ry: ry }, raceRoot);
    const p = el("m-group", {}, g);
    el("m-model", { src: M(src) }, p);
    if (anim) el("m-attr-anim", Object.assign({ start: 0, loop: "false" }, anim), p);
    return g;
  }
  function buildObstacles(plan) {
    const out = [];
    const H = COURSE.heading, D = COURSE.dirs;
    for (let k = 0; k < N; k++) {
      const P = plan && plan.m[k];
      // gates: an arm hinged at the lane's left edge swings up
      [["gates", 3, COURSE.gates[k]], ["last", 11, COURSE.last_gates[k]]].forEach(([id, run, p]) => {
        const n = [D[run][1], -D[run][0]];
        const at = [p[0] - n[0] * 4.3, p[1], p[2] - n[1] * 4.3];
        out.push(moving(at, H[run], P && { attr: "rz", end: 82, "start-time": Math.round(plan.doc(P.release[id] - 450)), duration: 700, easing: "easeOutQuad" }, "mr_gate"));
      });
      // trapdoor: a hatch hinged at the back swings down
      const t = COURSE.traps[k], d5 = D[5];
      out.push(moving([t[0] - d5[0] * 4.6, t[1], t[2] - d5[1] * 4.6], H[5],
        P && { attr: "rx", end: 88, "start-time": Math.round(plan.doc(P.release.trap - 120)), duration: 450, easing: "easeInQuad" }, "mr_hatch"));
      // elevator: a platform under the marble rises with it
      const e = COURSE.elevs[k];
      const rise = P && P.rise;
      out.push(moving(e, 0, P && { attr: "y", end: 10, "start-time": Math.round(plan.doc(rise.t0)), duration: Math.round(rise.t1 - rise.t0), easing: "easeInOutSine" }, "mr_elev"));
    }
    return out;
  }
  function rebuild(plan) {
    marbles.forEach((m) => m.root.remove());
    obstacles.forEach((o) => o.remove());
    marbles = [];
    for (let k = 0; k < N; k++) marbles.push(buildMarble(k, plan));
    obstacles = buildObstacles(plan);
  }

  // ==========================================================
  // THE RACE - every number random, drawn when boarding starts
  // ==========================================================
  const KIND = {
    lift: { ease: ["easeInOutSine", "easeInOutSine", "easeInOutSine"] },
    slope: { ease: ["linear", "linear", "linear"] },
    roll: { ease: ["linear", "linear", "linear"] },
    mud: { ease: ["linear", "linear", "linear"] },
    ramp: { ease: ["linear", "easeInQuad", "linear"] },
    drop: { ease: ["linear", "easeInQuad", "linear"] },
    rise: { ease: ["linear", "easeInOutSine", "linear"] },
    plunge: { ease: ["easeInQuad", "easeInQuad", "easeInQuad"] },
    brake: { ease: ["easeOutQuad", "easeOutQuad", "easeOutQuad"] },
  };
  const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
  const flat = (a, b) => Math.hypot(b[0] - a[0], b[2] - a[2]);
  const mid = (s) => Math.hypot(s.t1 - s.t0, s.b[1] - s.a[1]);    // a stretch's length down the middle
  const WAIT = { gates: WAIT_GATES, trap: WAIT_TRAP, lift: WAIT_ELEVATOR };

  // one marble's luck: its pace, how each stretch goes, how long each wait is
  function rollLuck() {
    const f = [], w = {};
    for (let i = 0; i < 40; i++) f.push(rand(1 - SPEED_SPREAD, 1 + SPEED_SPREAD));
    for (const id in WAIT) w[id] = rand(WAIT[id][0], WAIT[id][1]);
    return { v: RACE_SPEED * rand(0.96, 1.04), f: f, wait: w, mud: rand(MUD_SPEED[0], MUD_SPEED[1]) };
  }
  // how a marble in lane k runs with that luck, up to the last gates
  function runUpToLastGate(k, tLift, luck) {
    const L = COURSE.lanes[k], v = luck.v;
    const out = [], release = {};
    let t = tLift, rise = null, i = 0;
    for (; i < L.length; i++) {
      const s = L[i];
      if (s.hold === "last") break;
      if (s.hold) { t += luck.wait[s.hold] * 1000; release[s.hold] = t; }
      let dur;
      if (s.kind === "lift") dur = LIFT_SECONDS;
      else if (s.kind === "ramp") dur = flat(s.a, s.b) / v;
      else if (s.kind === "drop") dur = Math.sqrt(2 * Math.abs(s.b[1] - s.a[1]) / 7);
      else if (s.kind === "rise") dur = 4;
      // Times are measured down the middle of the track, not along the lane:
      // the outside lane is longer round every bend, and this way it just
      // rolls a little quicker there - every lane is worth the same.
      else if (s.kind === "mud") dur = mid(s) / (v * luck.mud);
      else dur = mid(s) / (v * luck.f[i]);
      const g = { a: s.a, b: s.b, kind: s.kind, ease: KIND[s.kind].ease, t0: t, t1: t + dur * 1000, run: s.run, s0: s.t0, s1: s.t1 };
      if (s.kind === "rise") rise = g;
      out.push(g);
      t = g.t1;
    }
    return { glides: out, release: release, arrive: t, rise: rise, next: i };
  }

  function makePlan() {
    const now = Date.now(), d0 = docNow();
    const tLift = now + (HOST.board + CLOSE_SECONDS) * 1000;
    const winner = Math.floor(Math.random() * N) % N;      // 1 in N, every race
    // Everyone's luck is rolled the same way. The drawn winner then swaps
    // luck with one of the three luckiest, so it reaches the last gates near
    // the front and nobody stands at a gate for long waiting for it. (Who
    // wins was already drawn above, so this changes nothing about the odds.)
    const luck = []; for (let k = 0; k < N; k++) luck.push(rollLuck());
    let R = luck.map((l, k) => runUpToLastGate(k, tLift, l));
    const byArrival = R.map((q, k) => k).sort((a, b) => R[a].arrive - R[b].arrive);
    if (byArrival.indexOf(winner) > 2) {
      const swap = byArrival[Math.floor(Math.random() * 3)];
      const tmp = luck[winner]; luck[winner] = luck[swap]; luck[swap] = tmp;
      R = luck.map((l, k) => runUpToLastGate(k, tLift, l));
    }
    // the last gates: the plunge and the run in, each marble at its own speed
    const m = R.map((q, k) => {
      const L = COURSE.lanes[k], pl = L[q.next], br = L[q.next + 1];
      const vEnd = rand(PLUNGE_SPEED[0], PLUNGE_SPEED[1]);
      const P = 2 * dist(pl.a, pl.b) / vEnd * 1000, Bk = 2 * dist(br.a, br.b) / vEnd * 1000;
      const finT = COURSE.finish_t, f = (finT - br.t0) / (br.t1 - br.t0);
      const u = 1 - Math.sqrt(1 - f);                      // when easeOutQuad passes the finish line
      return { q: q, pl: pl, br: br, P: P, B: Bk, cross: P + u * Bk };
    });
    const X = new Array(N), F = new Array(N);
    X[winner] = R[winner].arrive + rand(0.5, 2.5) * 1000;
    F[winner] = X[winner] + m[winner].cross;
    for (let k = 0; k < N; k++) {
      if (k === winner) continue;
      const want = F[winner] + rand(FINISH_GAPS[0], FINISH_GAPS[1]) * 1000;
      X[k] = Math.max(want - m[k].cross, R[k].arrive + 400);
      F[k] = X[k] + m[k].cross;
    }
    const plan = { winner: winner, tLift: tLift, tRace: tLift + LIFT_SECONDS * 1000, m: [], announced: false,
      doc: (t) => d0 + (t - now) };
    let end = 0;
    for (let k = 0; k < N; k++) {
      const q = R[k], mm = m[k];
      const glides = q.glides.slice();
      const pl = mm.pl, br = mm.br;
      glides.push({ a: pl.a, b: pl.b, kind: "plunge", ease: KIND.plunge.ease, t0: X[k], t1: X[k] + mm.P, run: pl.run, s0: pl.t0, s1: pl.t1 });
      glides.push({ a: br.a, b: br.b, kind: "brake", ease: KIND.brake.ease, t0: X[k] + mm.P, t1: X[k] + mm.P + mm.B, run: br.run, s0: br.t0, s1: br.t1 });
      const release = Object.assign({}, q.release, { last: X[k] });
      const home = X[k] + mm.P + mm.B;
      end = Math.max(end, home);
      plan.m.push({ glides: glides, release: release, rise: q.rise, finish: F[k], home: home });
    }
    plan.end = end + 1500;
    return plan;
  }

  // where marble k is round the course at time t (for the boards)
  const RUN_START = []; (function () { let s = 0; COURSE.runlen.forEach((l) => { RUN_START.push(s); s += l; }); })();
  function progress(k, t) {
    if (!plan) return 0;
    const G = plan.m[k].glides;
    let last = 0;
    for (let i = 0; i < G.length; i++) {
      const g = G[i];
      if (t < g.t0) return last;
      const u = Math.min(1, (t - g.t0) / Math.max(1, g.t1 - g.t0));
      const e = EASE[g.ease[0]] || EASE.linear;
      last = RUN_START[g.run] + g.s0 + (g.s1 - g.s0) * e(u);
      if (u < 1) return last;
    }
    return last;
  }
  function headingAt(k, t) {
    const G = plan.m[k].glides;
    let h = COURSE.heading[0];
    for (let i = 0; i < G.length && G[i].t0 <= t; i++) h = COURSE.heading[G[i].run];
    return h;
  }

  // ==========================================================
  // BOARDS - the only live text: three boards of 9 lines
  // ==========================================================
  const boards = WORLD.boards.map((b) => {
    const g = el("m-group", { x: b.x, y: b.y, z: b.z, ry: b.ry });
    const rows = [];
    for (let r = 0; r <= N; r++) {
      rows.push(el("m-label", { z: 0.12, y: 8.8 - r * 2.2, width: 21, height: r ? 1.9 : 2.1, "font-size": r ? 150 : 170, alignment: "center",
        color: "#16161a", "font-color": r ? "#f1f2ea" : "#ffd23f", content: r ? COURSE.names[r - 1] : "THE GRAND MARBLE RUN" }, g));
    }
    return rows;
  });
  let noticeText = "", noticeUntil = 0;
  function notice(text, ms) { noticeText = text; noticeUntil = Date.now() + ms; paintBoards(); }
  function standings(t) {
    const o = []; for (let k = 0; k < N; k++) o.push(k);
    o.sort((a, b) => {
      const fa = t >= plan.m[a].finish, fb = t >= plan.m[b].finish;
      if (fa && fb) return plan.m[a].finish - plan.m[b].finish;
      if (fa !== fb) return fa ? -1 : 1;
      return progress(b, t) - progress(a, t);
    });
    return o;
  }
  function paintBoards() {
    const t = Date.now();
    let title = "THE GRAND MARBLE RUN";
    let rows = COURSE.names.map((n, k) => [n, COURSE.colors[k]]);
    if (phase === "BOARDING") title = "BOARDING  " + Math.max(0, Math.ceil((plan.tLift - CLOSE_SECONDS * 1000 - t) / 1000));
    else if (phase === "RACE" && t < plan.tLift) title = "DOORS CLOSED";
    else if (phase === "RACE" && t < plan.tRace) title = "UP THE LIFT HILL";
    else if (phase === "RACE" && !plan.announced) title = "RACING";
    if (plan && plan.announced) title = COURSE.names[plan.winner] + " WINS!";
    if (plan && (phase === "RACE" || plan.announced) && t >= plan.tRace) {
      const o = standings(t);
      rows = o.map((k, i) => {
        let s = (i + 1) + "   " + COURSE.names[k];
        if (t >= plan.m[k].finish) s += i === 0 ? "   WINNER" : "   +" + ((plan.m[k].finish - plan.m[o[0]].finish) / 1000).toFixed(1) + "s";
        return [s, COURSE.colors[k]];
      });
    }
    if (noticeUntil > t) title = noticeText;
    boards.forEach((b) => {
      setText(b[0], title);
      for (let r = 0; r < N; r++) setText(b[r + 1], rows[r][0], rows[r][1]);
    });
  }

  // ==========================================================
  // GAME FLOW
  // ==========================================================
  let phase = "IDLE";     // IDLE | BOARDING | RACE
  const HOST = { board: BOARD_SECONDS, auto: false, gap: AUTO_GAP_SECONDS, kiosks: true, nextAt: 0, nextT: 0 };
  let plan = null, timers = [], cancelArmedUntil = 0;
  function at(t, fn) { timers.push(later(fn, t - Date.now())); }
  function clearTimers() { timers.forEach((h) => clearTimeout(h)); timers = []; }

  function startRace() {
    clearTimers();
    clearTimeout(HOST.nextT); HOST.nextAt = 0;
    plan = makePlan();
    phase = "BOARDING";
    rebuild(plan);
    setDoors(false);
    setBridge(true);
    const P = plan;
    at(P.tLift - CLOSE_SECONDS * 1000, () => { phase = "RACE"; setDoors(true); setBridge(false); paintBoards(); });
    // the glass faces each new run as the marble turns into it (looks only)
    for (let k = 0; k < N; k++) {
      let prev = P.m[k].glides[0].run;
      P.m[k].glides.forEach((g) => {
        if (g.run === prev) return;
        prev = g.run;
        const m = marbles[k], ry = Math.round(COURSE.heading[g.run]);
        at(g.t0, () => { if (plan === P) m.turn.setAttribute("ry", String(ry)); });
      });
    }
    at(P.m[P.winner].finish, () => {
      if (plan !== P) return;
      P.announced = true;
      flashLight.setAttribute("color", COURSE.colors[P.winner]);
      flashLight.setAttribute("intensity", String(3 * LIGHT));
      at(Date.now() + 6000, () => flashLight.setAttribute("intensity", "0"));
      paintBoards();
    });
    at(P.end, () => {
      if (plan !== P) return;
      phase = "IDLE";
      rebuild(null);              // a clean slate: every race animation leaves with its parts
      setDoors(false);
      setBridge(true);
      paintBoards();
      if (HOST.auto) queueAuto(HOST.gap * 1000);
    });
    paintBoards();
  }
  function cancelRace() {
    clearTimers();
    const P = plan;
    plan = null;
    phase = "IDLE";
    rebuild(null);
    setDoors(false);
    setBridge(true);
    notice("RACE CANCELLED", 6000);
  }
  function codeEntered() {
    const now = Date.now();
    if (phase === "IDLE") { cancelArmedUntil = 0; startRace(); return; }
    if (now < cancelArmedUntil) { cancelArmedUntil = 0; cancelRace(); return; }
    cancelArmedUntil = now + CANCEL_WINDOW;
    notice("CODE AGAIN TO CANCEL", CANCEL_WINDOW);
  }
  // race control: a see-through box over each kiosk, inside the code prompt.
  // (it must be drawn to be clicked: visible="false" makes it unclickable, opacity 0 doesn't)
  const HIT = { color: "#ffffff", opacity: 0, "cast-shadows": "false", collide: "false" };
  [-1, 1].forEach((sd) => {
    const wrap = el("m-prompt", { message: "Race code", placeholder: "code" });
    el("m-cube", Object.assign({ x: sd * (COURSE.half + 12), y: 2.2, z: -5, width: 5.2, height: 3.4, depth: 4.2 }, HIT), wrap);
    on(wrap, "prompt", (e) => {
      const typed = String((e && e.detail && e.detail.value) || "").replace(/[^0-9]/g, "");
      if (typed !== RACE_CODE) return;                 // anything else: nothing happens
      if (!HOST.kiosks) { notice("RACE CONTROL IS OFF", 4000); return; }
      codeEntered();
    });
  });

  // ==========================================================
  // HOST REMOTE - marble_run_remote.html types "<code> <command>" into this prompt
  // and reads the answers off the board below (only remotes ever receive it)
  // ==========================================================
  const PARK = -500;
  const hostPrompt = el("m-prompt", { id: "mr-host", message: "Host code + command", placeholder: "code + command", x: 0, y: PARK, z: 0 });
  const remoteBoard = el("m-group", { id: "mr-remote", y: PARK, "visible-to": "-1" });
  const ONLINE = new Set(), REMOTES = new Set();
  const ack = { n: 0, l: [] };
  function hostMsg(t) {
    t = String(t); ack.n++; ack.l.push({ n: ack.n, t }); if (ack.l.length > 12) ack.l.shift();
    remoteBoard.setAttribute("data-ack", JSON.stringify({ n: ack.n, t, l: ack.l }));
    paintRemote();
  }
  function riders(k) {
    const m = RIDERS[k]; if (!m) return 0;
    let n = 0;                     // (players standing still send no "move" events, so no time-out: a step off sends "end")
    m.forEach((t, id) => { if (!ONLINE.has(id)) m.delete(id); else n++; });
    return n;
  }
  function paintRemote() {
    if (!REMOTES.size) return;
    const t = Date.now();
    const P = plan;
    let ph = "idle";
    if (phase === "BOARDING") ph = "boarding";
    else if (phase === "RACE") ph = P && P.announced ? "finished" : t < P.tRace ? "lift" : "race";
    const order = P && t >= P.tRace ? standings(t) : null;
    const g = {
      now: t, ph, ev: ack.l.length ? ack.l[ack.l.length - 1].t : "",
      board: HOST.board, auto: HOST.auto, gap: HOST.gap, kiosks: HOST.kiosks, nextAt: HOST.nextAt || 0,
      online: ONLINE.size, errors: scriptErrors, lastError,
      closeAt: P ? P.tLift - CLOSE_SECONDS * 1000 : 0, liftAt: P ? P.tLift : 0, raceAt: P ? P.tRace : 0, endAt: P ? P.end : 0,
      winner: P && P.announced ? COURSE.names[P.winner] : "",
      cancelArmed: t < cancelArmedUntil,
      marbles: COURSE.names.map((n, k) => ({
        n, c: COURSE.colors[k], riders: riders(k),
        pos: order ? order.indexOf(k) + 1 : 0,
        done: !!(P && t >= P.m[k].finish && t >= P.tRace),
        gap: P && order && t >= P.m[k].finish ? Math.round(P.m[k].finish - P.m[order[0]].finish) : null,
      })),
    };
    remoteBoard.setAttribute("data-game", JSON.stringify(g));
  }
  every(paintRemote, 1000);
  function hostCommand(cmd, parts, rest) {
    if (cmd === "start") {
      if (phase !== "IDLE") return "A RACE IS ALREADY ON";
      cancelArmedUntil = 0; startRace(); return "RACE STARTED - BOARDING FOR " + HOST.board + " S";
    }
    if (cmd === "cancel" || cmd === "stop") {
      if (phase === "IDLE") { if (HOST.nextAt) { clearTimeout(HOST.nextT); HOST.nextAt = 0; return "NEXT AUTO RACE CALLED OFF"; } return "NO RACE TO CANCEL"; }
      cancelRace(); return "RACE CANCELLED - EVERYONE BACK IN THE STATION";
    }
    if (cmd === "board") {
      const v = parseInt(parts[1], 10);
      if (!(v >= 10 && v <= 120)) return "BOARDING TIME MUST BE 10 TO 120 S";
      HOST.board = v; return "BOARDING TIME " + v + " S" + (phase === "BOARDING" ? " (FROM THE NEXT RACE)" : "");
    }
    if (cmd === "auto") {
      const a = (parts[1] || "").toLowerCase();
      HOST.auto = a === "on" ? true : a === "off" ? false : !HOST.auto;
      if (!HOST.auto && HOST.nextAt) { clearTimeout(HOST.nextT); HOST.nextAt = 0; }
      if (HOST.auto && phase === "IDLE" && !HOST.nextAt) queueAuto(5000);
      return HOST.auto ? "AUTO RACES ON - A NEW RACE " + HOST.gap + " S AFTER EACH ONE" : "AUTO RACES OFF";
    }
    if (cmd === "gap") {
      const v = parseInt(parts[1], 10);
      if (!(v >= 10 && v <= 600)) return "THE GAP MUST BE 10 TO 600 S";
      HOST.gap = v; return "AUTO GAP " + v + " S";
    }
    if (cmd === "kiosks") {
      const a = (parts[1] || "").toLowerCase();
      HOST.kiosks = a === "on" ? true : a === "off" ? false : !HOST.kiosks;
      return HOST.kiosks ? "RACE CONTROL KIOSKS ON" : "RACE CONTROL KIOSKS OFF - ONLY THE REMOTE STARTS RACES";
    }
    if (cmd === "say") {
      const text = rest.slice(3).trim().toUpperCase().replace(/[^A-Z0-9 !?.,'&:+-]/g, "").slice(0, 28);
      if (!text) return "SAY WHAT? TRY: SAY GOOD LUCK";
      notice(text, 10000); return "ON THE BOARDS: " + text;
    }
    if (cmd === "status") {
      return (phase === "IDLE" ? "WAITING" : phase) + " - " + ONLINE.size + " ONLINE - AUTO " + (HOST.auto ? "ON" : "OFF");
    }
    return null;
  }
  on(hostPrompt, "prompt", (e) => {
    const raw = String((e && e.detail && e.detail.value) || "").replace(/\s+/g, " ").trim();
    if (raw.indexOf(RACE_CODE) !== 0) { hostMsg("WRONG CODE"); return; }
    const rest = raw.slice(RACE_CODE.length).trim();
    const parts = rest.split(" ").filter(Boolean);
    const cmd = (parts[0] || "").toLowerCase();
    const id = e.detail.connectionId;
    if (cmd === "remote") {
      if (id === undefined) { hostMsg("REMOTE: NO CONNECTION ID"); return; }
      REMOTES.add(id); ONLINE.delete(id); remoteBoard.setAttribute("visible-to", Array.from(REMOTES).join(" "));
      hostMsg("UNLOCKED"); return;
    }
    let reply = null;
    try { reply = hostCommand(cmd, parts, rest); } catch (err) { reply = "ERROR: " + (err && err.message); }
    hostMsg(reply || "UNKNOWN: " + (cmd || "(nothing)") + " - TRY: START, CANCEL, AUTO, BOARD 30");
  });
  window.addEventListener("connected", guard((e) => { if (e.detail && !REMOTES.has(e.detail.connectionId)) ONLINE.add(e.detail.connectionId); }));
  window.addEventListener("disconnected", guard((e) => {
    const c = e.detail && e.detail.connectionId;
    ONLINE.delete(c);
    RIDERS.forEach((m) => m && m.delete(c));
    if (REMOTES.delete(c)) remoteBoard.setAttribute("visible-to", REMOTES.size ? Array.from(REMOTES).join(" ") : "-1");
  }));
  function queueAuto(ms) {
    clearTimeout(HOST.nextT);
    HOST.nextAt = Date.now() + ms;
    HOST.nextT = later(() => { HOST.nextAt = 0; if (HOST.auto && phase === "IDLE") { startRace(); hostMsg("AUTO: NEW RACE - BOARDING"); } }, ms);
  }

  every(paintBoards, 2000);
  rebuild(null);
  setDoors(false);
  paintBoards();
</script>
