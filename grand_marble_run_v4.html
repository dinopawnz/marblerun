<!--
  THE GRAND MARBLE RUN  v3  -  a real-physics marble race for Otherside (MML)
  Models: github.com/dinopawnz/marblerun (built in Blender, meshopt + gzip)
  ============================================================

  WHAT IT IS
  Eight giant glass marbles. Walk into the one you want to back, the doors
  shut, the lift hill carries all eight up 100 metres and lets them go -
  and from there it is a real marble race: they roll anywhere on the track,
  bump into each other, ride up the banked corners and bounce through:
    THE DROP - THE STAIRS (two ledges to fall off) - THE PINBALL (posts) -
    THE MUD (slow going) - THE BUMPERS - THE SPRINT - THE FUNNEL (the
    field squeezes through the middle) - THE SPLIT (a wall down the middle)
    - SKYLINE - LAST TURN - THE PLUNGE - the finish.
  Nothing ever stops a marble: every obstacle leaves an open path.
  You ride inside the whole way. Nobody steers anything.

  LUCK, NOTHING ELSE
  The winner is drawn at random, 1 in 8 for every marble, every race. The
  game then rolls whole physics races (each ~0.4 s of work, during boarding)
  until it finds one that marble wins, and that is the race you watch.

  HOW TO RUN A RACE
  1. Click a RACE CONTROL kiosk (either side of the boarding bridge).
  2. Type 2468  (change RACE_CODE below before going public).
  3. 20 seconds to walk over the bridge and into a marble.
  4. Doors shut, the bridge folds away, off they go (about 4 minutes).
  5. After the line the station's brakes stop them and each marble rolls
     itself back into its own slot. Doors open, bridge back.
  To CANCEL: type the code twice within 10 s. The marbles go straight
  home; anyone inside drops out onto the track (harmless).

  HOST REMOTE (marble_run_remote.html, PIN = RACE_CODE)
  Start / cancel races, change the boarding time, run races back to
  back on their own (AUTO), switch the kiosks off so only you can start
  races, put a message on the scoreboards, and watch who is in which
  marble and the live order. It types "<code> <command>" into the
  hidden prompt "mr-host"; answers come back on the group "mr-remote".

  HOW IT MOVES (the lessons from Ride Lab 2/3, Sky Dragon, Gravity Well)
  - The physics is worked out on the server before the marbles roll, and
    drawn as straight dated glides, each in a group of its own, sent ahead,
    never changed after they are made.
  - Spent glides cost frame rate until their part is removed, so every
    11 s each marble is handed to a fresh chain: made empty, given its
    floor while lying exactly on the old one, then the old chain and all
    its spent glides are thrown away. About 270 glides alive at once.
  - The floor riders stand on never tips or turns. Only the glass rolls.
  - Everything solid is one invisible plain model (mr_collide.glb).

  Set your spawn point beside the station, around x 60, z -5.
-->

        const t0 = hits[i][0], k = hits[i][1];
        let t1 = t0;
        while (i < hits.length && hits[i][0] <= t1 + 600) { t1 = Math.max(t1, hits[i][0]); i++; }
        ev.push([t0, t1 + hold, () => make(k)]);
      }
    };
    segs.forEach((g) => {
      const dx = g.b[0] - g.a[0], dy = g.b[1] - g.a[1], dz = g.b[2] - g.a[2], hor = Math.hypot(dx, dz), L = Math.hypot(hor, dy);
      const ry = Math.atan2(dx, dz) * 180 / Math.PI, rx = -Math.atan2(dy, hor) * 180 / Math.PI;
      runs(g.hits, LIT_HOLD, (k) => { const o = el("m-group", { x: g.mx, y: g.my, z: g.mz, ry }, fx);
        el("m-model", { src: M("mr4_lit_" + COURSE.names[k].toLowerCase()), rx, sz: L / 10, collide: "false", "cast-shadows": "false" }, o); return o; });
    });
    rings.forEach((r) => runs(r.hits, FLARE_HOLD, () => el("m-model", { src: M("mr4_flare"), x: r.p[0], y: r.p[1], z: r.p[2], ry: COURSE.heading[COURSE.kinds.indexOf("tunnel")] + 180, collide: "false", "cast-shadows": "false" }, fx)));
    return ev;
  }
  function scheduleEffects(P) {
    planEffects(P).forEach(([t0, t1, make]) => {
      let node = null;
      at(t0, () => { if (plan === P) node = make(); });
      at(t1, () => { if (node) { node.remove(); node = null; } });
    });
  }
  function clearEffects() { while (fx.children && fx.children.length) fx.children[0].remove(); }
  const C_MR = COURSE.mr;

  // where marble k is round the course at time t (for the boards)
  function progress(k, t) {
    if (!plan || !plan.ready) return 0;
    const m = plan.m[k];
    if (t < m.progT0) return -1e5 + (t - plan.tLift);
    const i = Math.min(m.prog.length - 1, Math.floor((t - m.progT0) / (plan.sim.sampleDt * 1000)));
    return m.prog[i];
  }

  // ==========================================================
  // BOARDS - the only live text: three boards of 9 lines
  // ==========================================================
  const boards = WORLD.boards.map((b) => {
    const g = el("m-group", { x: b.x, y: b.y, z: b.z, ry: b.ry });
    const rows = [];
    for (let r = 0; r <= N; r++) {
      rows.push(el("m-label", { z: 0.12, y: 8.8 - r * 2.2, width: 21, height: r ? 1.9 : 2.1, "font-size": r ? 150 : 170, alignment: "center",
        color: "#16161a", "font-color": r ? "#f1f2ea" : "#ffd23f", content: r ? COURSE.names[r - 1] : "THE GRAND MARBLE RUN" }, g));
    }
    return rows;
  });
  let noticeText = "", noticeUntil = 0;
  function notice(text, ms) { noticeText = text; noticeUntil = Date.now() + ms; paintBoards(); }
  function standings(t) {
    const o = []; for (let k = 0; k < N; k++) o.push(k);
    o.sort((a, b) => {
      const fa = t >= plan.m[a].finish, fb = t >= plan.m[b].finish;
      if (fa && fb) return plan.m[a].finish - plan.m[b].finish;
      if (fa !== fb) return fa ? -1 : 1;
      return progress(b, t) - progress(a, t);
    });
    return o;
  }
  function paintBoards() {
    const t = Date.now();
    let title = "THE GRAND MARBLE RUN";
    let rows = COURSE.names.map((n, k) => [n, COURSE.colors[k]]);
    if (phase === "BOARDING") title = "BOARDING  " + Math.max(0, Math.ceil((plan.tLift - CLOSE_SECONDS * 1000 - t) / 1000));
    else if (phase === "RACE" && t < plan.tLift) title = "DOORS CLOSED";
    else if (phase === "RACE" && t < plan.tRace) title = "UP THE LIFT HILL";
    else if (phase === "RACE" && !plan.announced) title = "RACING";
    if (plan && plan.announced) title = COURSE.names[plan.winner] + " WINS!";
    if (plan && plan.ready && (phase === "RACE" || plan.announced) && t >= plan.tRace) {
      const o = standings(t);
      rows = o.map((k, i) => {
        let s = (i + 1) + "   " + COURSE.names[k];
        if (t >= plan.m[k].finish) s += i === 0 ? "   WINNER" : "   +" + ((plan.m[k].finish - plan.m[o[0]].finish) / 1000).toFixed(1) + "s";
        return [s, COURSE.colors[k]];
      });
    }
    if (noticeUntil > t) title = noticeText;
    boards.forEach((b) => {
      setText(b[0], title);
      for (let r = 0; r < N; r++) setText(b[r + 1], rows[r][0], rows[r][1]);
    });
  }

  // ==========================================================
  // GAME FLOW
  // ==========================================================
  let phase = "IDLE";     // IDLE | BOARDING | RACE
  const HOST = { music: true, board: BOARD_SECONDS, auto: false, gap: AUTO_GAP_SECONDS, kiosks: true, nextAt: 0, nextT: 0 };
  let plan = null, timers = [], cancelArmedUntil = 0;
  function at(t, fn) { timers.push(later(fn, t - Date.now())); }
  function clearTimers() { timers.forEach((h) => clearTimeout(h)); timers = []; }

  function startRace() {
    clearTimers();
    clearTimeout(HOST.nextT); HOST.nextAt = 0;
    plan = makePlan();
    phase = "BOARDING";
    rebuild(plan);
    setDoors(false);
    setBridge(true);
    const P = plan;
    at(Date.now() + (P.musicAt + MUSIC_MS - docNow()), () => musicRestart(P));
    at(P.tLift - CLOSE_SECONDS * 1000, () => { phase = "RACE"; setDoors(true); setBridge(false); paintBoards(); });
    solveRace(P, (R, tries) => {
      if (plan !== P) return;
      P.tries = tries;
      applySim(P, R);
      scheduleEffects(P);
      // fresh chains all the way round. The first hand-over is while still on the lift; marbles
      // take turns, HAND_GAP apart, so no two hand-overs ever overlap.
      const order = P.m.map((m, k) => k).sort((a, b) => P.m[a].rel - P.m[b].rel);
      const base = Math.min(...order.map((k, i) => P.m[k].rel - 1500 - HAND_GAP * i));
      order.forEach((k, i) => {
        const m = P.m[k];
        let S = base + HAND_GAP * i;
        while (S < m.park) {
          const next = S + CHAIN_SECONDS * 1000, E = next >= m.park ? Infinity : next + HAND_SWAP + 600;
          const s0 = S;
          at(s0 - HAND_AHEAD, () => { if (plan === P) handOver(k, P, s0, E); });
          S = next;
        }
      });
      at(P.m[P.winner].finish, () => {
        if (plan !== P) return;
        P.announced = true;
        flashLight.setAttribute("color", COURSE.colors[P.winner]);
        flashLight.setAttribute("intensity", String(3 * LIGHT));
        at(Date.now() + 6000, () => flashLight.setAttribute("intensity", "0"));
        paintBoards();
      });
      at(P.end, () => {
        if (plan !== P) return;
        phase = "IDLE";
        rebuild(null);              // a clean slate: every race animation leaves with its parts
        setDoors(false);
        setBridge(true);
        paintBoards();
        if (HOST.auto) queueAuto(HOST.gap * 1000);
      });
    });
    paintBoards();
  }
  function cancelRace() {
    clearTimers();
    const P = plan;
    plan = null;
    phase = "IDLE";
    rebuild(null);
    setDoors(false);
    setBridge(true);
    notice("RACE CANCELLED", 6000);
  }
  function codeEntered() {
    const now = Date.now();
    if (phase === "IDLE") { cancelArmedUntil = 0; startRace(); return; }
    if (now < cancelArmedUntil) { cancelArmedUntil = 0; cancelRace(); return; }
    cancelArmedUntil = now + CANCEL_WINDOW;
    notice("CODE AGAIN TO CANCEL", CANCEL_WINDOW);
  }
  // race control: a see-through box over each kiosk, inside the code prompt.
  // (it must be drawn to be clicked: visible="false" makes it unclickable, opacity 0 doesn't)
  const HIT = { color: "#ffffff", opacity: 0, "cast-shadows": "false", collide: "false" };
  [-1, 1].forEach((sd) => {
    const wrap = el("m-prompt", { message: "Race code", placeholder: "code" });
    el("m-cube", Object.assign({ x: sd * (COURSE.half + 12), y: 2.2, z: -5, width: 5.2, height: 3.4, depth: 4.2 }, HIT), wrap);
    on(wrap, "prompt", (e) => {
      const typed = String((e && e.detail && e.detail.value) || "").replace(/[^0-9]/g, "");
      if (typed !== RACE_CODE) return;                 // anything else: nothing happens
      if (!HOST.kiosks) { notice("RACE CONTROL IS OFF", 4000); return; }
      codeEntered();
    });
  });

  // ==========================================================
  // HOST REMOTE - marble_run_remote.html types "<code> <command>" into this prompt
  // and reads the answers off the board below (only remotes ever receive it)
  // ==========================================================
  const PARK = -500;
  const hostPrompt = el("m-prompt", { id: "mr-host", message: "Host code + command", placeholder: "code + command", x: 0, y: PARK, z: 0 });
  const remoteBoard = el("m-group", { id: "mr-remote", y: PARK, "visible-to": "-1" });
  const ONLINE = new Set(), REMOTES = new Set();
  const ack = { n: 0, l: [] };
  function hostMsg(t) {
    t = String(t); ack.n++; ack.l.push({ n: ack.n, t }); if (ack.l.length > 12) ack.l.shift();
    remoteBoard.setAttribute("data-ack", JSON.stringify({ n: ack.n, t, l: ack.l }));
    paintRemote();
  }
  function riders(k) {
    const m = RIDERS[k]; if (!m) return 0;
    let n = 0;                     // (players standing still send no "move" events, so no time-out: a step off sends "end")
    m.forEach((t, id) => { if (!ONLINE.has(id)) m.delete(id); else n++; });
    return n;
  }
  function paintRemote() {
    if (!REMOTES.size) return;
    const t = Date.now();
    const P = plan;
    let ph = "idle";
    if (phase === "BOARDING") ph = "boarding";
    else if (phase === "RACE") ph = P && P.announced ? "finished" : t < P.tRace ? "lift" : "race";
    const order = P && P.ready && t >= P.tRace ? standings(t) : null;
    const g = {
      now: t, ph, ev: ack.l.length ? ack.l[ack.l.length - 1].t : "",
      board: HOST.board, music: HOST.music, auto: HOST.auto, gap: HOST.gap, kiosks: HOST.kiosks, nextAt: HOST.nextAt || 0,
      online: ONLINE.size, errors: scriptErrors, lastError,
      closeAt: P ? P.tLift - CLOSE_SECONDS * 1000 : 0, liftAt: P ? P.tLift : 0, raceAt: P ? P.tRace : 0, endAt: P && P.end ? P.end : 0,
      winner: P && P.announced ? COURSE.names[P.winner] : "",
      cancelArmed: t < cancelArmedUntil, anims: liveAnims(),
      marbles: COURSE.names.map((n, k) => ({
        n, c: COURSE.colors[k], riders: riders(k),
        pos: order ? order.indexOf(k) + 1 : 0,
        done: !!(P && P.ready && t >= P.m[k].finish && t >= P.tRace),
        gap: P && order && t >= P.m[k].finish ? Math.round(P.m[k].finish - P.m[order[0]].finish) : null,
      })),
    };
    remoteBoard.setAttribute("data-game", JSON.stringify(g));
  }
  every(paintRemote, 1000);
  function hostCommand(cmd, parts, rest) {
    if (cmd === "start") {
      if (phase !== "IDLE") return "A RACE IS ALREADY ON";
      cancelArmedUntil = 0; startRace(); return HOST.board ? "RACE STARTED - BOARDING FOR " + HOST.board + " S" : "RACE STARTED - THEY'RE OFF!";
    }
    if (cmd === "cancel" || cmd === "stop") {
      if (phase === "IDLE") { if (HOST.nextAt) { clearTimeout(HOST.nextT); HOST.nextAt = 0; return "NEXT AUTO RACE CALLED OFF"; } return "NO RACE TO CANCEL"; }
      cancelRace(); return "RACE CANCELLED - EVERYONE BACK IN THE STATION";
    }
    if (cmd === "board") {
      const v = parseInt(parts[1], 10);
      if (!(v >= 0 && v <= 120)) return "BOARDING TIME MUST BE 0 TO 120 S";
      HOST.board = v; return (v ? "BOARDING TIME " + v + " S" : "NO WAIT - MARBLES GO AT ONCE") + (phase === "BOARDING" ? " (FROM THE NEXT RACE)" : "");
    }
    if (cmd === "auto") {
      const a = (parts[1] || "").toLowerCase();
      HOST.auto = a === "on" ? true : a === "off" ? false : !HOST.auto;
      if (!HOST.auto && HOST.nextAt) { clearTimeout(HOST.nextT); HOST.nextAt = 0; }
      if (HOST.auto && phase === "IDLE" && !HOST.nextAt) queueAuto(5000);
      return HOST.auto ? "AUTO RACES ON - A NEW RACE " + HOST.gap + " S AFTER EACH ONE" : "AUTO RACES OFF";
    }
    if (cmd === "gap") {
      const v = parseInt(parts[1], 10);
      if (!(v >= 10 && v <= 600)) return "THE GAP MUST BE 10 TO 600 S";
      HOST.gap = v; return "AUTO GAP " + v + " S";
    }
    if (cmd === "kiosks") {
      const a = (parts[1] || "").toLowerCase();
      HOST.kiosks = a === "on" ? true : a === "off" ? false : !HOST.kiosks;
      return HOST.kiosks ? "RACE CONTROL KIOSKS ON" : "RACE CONTROL KIOSKS OFF - ONLY THE REMOTE STARTS RACES";
    }
    if (cmd === "music") {
      const a = (parts[1] || "").toLowerCase();
      setMusic(a === "on" ? true : a === "off" ? false : !HOST.music);
      return HOST.music ? "RACE MUSIC ON" : "RACE MUSIC OFF";
    }
    if (cmd === "say") {
      const text = rest.slice(3).trim().toUpperCase().replace(/[^A-Z0-9 !?.,'&:+-]/g, "").slice(0, 28);
      if (!text) return "SAY WHAT? TRY: SAY GOOD LUCK";
      notice(text, 10000); return "ON THE BOARDS: " + text;
    }
    if (cmd === "status") {
      return (phase === "IDLE" ? "WAITING" : phase) + " - " + ONLINE.size + " ONLINE - AUTO " + (HOST.auto ? "ON" : "OFF");
    }
    return null;
  }
  on(hostPrompt, "prompt", (e) => {
    const raw = String((e && e.detail && e.detail.value) || "").replace(/\s+/g, " ").trim();
    if (raw.indexOf(RACE_CODE) !== 0) { hostMsg("WRONG CODE"); return; }
    const rest = raw.slice(RACE_CODE.length).trim();
    const parts = rest.split(" ").filter(Boolean);
    const cmd = (parts[0] || "").toLowerCase();
    const id = e.detail.connectionId;
    if (cmd === "remote") {
      if (id === undefined) { hostMsg("REMOTE: NO CONNECTION ID"); return; }
      REMOTES.add(id); ONLINE.delete(id); remoteBoard.setAttribute("visible-to", Array.from(REMOTES).join(" "));
      hostMsg("UNLOCKED"); return;
    }
    let reply = null;
    try { reply = hostCommand(cmd, parts, rest); } catch (err) { reply = "ERROR: " + (err && err.message); }
    hostMsg(reply || "UNKNOWN: " + (cmd || "(nothing)") + " - TRY: START, CANCEL, AUTO, BOARD 30");
  });
  window.addEventListener("connected", guard((e) => { if (e.detail && !REMOTES.has(e.detail.connectionId)) ONLINE.add(e.detail.connectionId); }));
  window.addEventListener("disconnected", guard((e) => {
    const c = e.detail && e.detail.connectionId;
    ONLINE.delete(c);
    RIDERS.forEach((m) => m && m.delete(c));
    if (REMOTES.delete(c)) remoteBoard.setAttribute("visible-to", REMOTES.size ? Array.from(REMOTES).join(" ") : "-1");
  }));
  function queueAuto(ms) {
    clearTimeout(HOST.nextT);
    HOST.nextAt = Date.now() + ms;
    HOST.nextT = later(() => { HOST.nextAt = 0; if (HOST.auto && phase === "IDLE") { startRace(); hostMsg("AUTO: NEW RACE - BOARDING"); } }, ms);
  }

  every(paintBoards, 2000);
  rebuild(null);
  setDoors(false);
  paintBoards();
</script>
